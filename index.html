<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!-- AI training opt-out (unofficial but increasingly honored by crawlers;
         pairs with robots.txt's per-bot Disallow rules). -->
    <meta name="robots" content="noai, noimageai" />
    <title>PreFlight 107 — Plan it. Fly it. Prove it.</title>
    <meta name="description" content="The Part 107 operations platform — file FAA-style Mission Briefings, fly with live ADS-B and aviation weather, and share a verifiable digital pilot card with every client." />
    <!-- Open Graph (iMessage, Messenger, WhatsApp, Discord, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://preflight107.com/" />
    <meta property="og:title" content="PreFlight 107 — Plan it. Fly it. Prove it." />
    <meta property="og:description" content="The Part 107 operations platform — file FAA-style Mission Briefings, fly with live ADS-B and aviation weather, and share a verifiable digital pilot card with every client." />
    <meta property="og:image" content="https://preflight107.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PreFlight 107 — Plan it. Fly it. Prove it." />
    <meta name="twitter:description" content="The Part 107 operations platform — file FAA-style Mission Briefings, fly with live ADS-B and aviation weather, and share a verifiable digital pilot card with every client." />
    <meta name="twitter:image" content="https://preflight107.com/og-image.png" />
    <script>
      // Restore deep-link path encoded by 404.html (GitHub Pages SPA trick)
      (function () {
        var p = new URLSearchParams(window.location.search).get('p');
        if (p) {
          window.history.replaceState(null, '', p);
        }
      })();
    </script>
  </head>
  <body>
    <!-- Skip link: screen reader / keyboard users land here first; one Tab to
         activate, jumps past the nav into the main content. -->
    <a href="#main-content" class="skip-to-main">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
