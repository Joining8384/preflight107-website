<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <title>Verified Part 107 Pilot Profile — PreFlight 107</title>
    <meta name="description" content="A PreFlight 107 pilot profile — verified FAA Part 107 credentials, business contact, insurance, and tamper-verified mission briefing history." />
    <!--
      Per-route shim for /pilot/ (no account number).
      Pilot card URLs land at /pilot/<account_number> — those still hit
      /404.html since GitHub Pages can't generate per-account static files.
      The fallback 404.html meta is tuned to work decently for those.
    -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="PreFlight 107" />
    <meta property="og:url" content="https://preflight107.com/pilot" />
    <meta property="og:title" content="Verified Part 107 Pilot Profile" />
    <meta property="og:description" content="A PreFlight 107 pilot profile — verified FAA Part 107 credentials, business contact, insurance, and tamper-verified mission briefing history." />
    <meta property="og:image" content="https://preflight107.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Verified Part 107 Pilot Profile" />
    <meta name="twitter:description" content="A PreFlight 107 pilot profile — verified credentials, contact, insurance, and tamper-verified briefing history." />
    <meta name="twitter:image" content="https://preflight107.com/og-image.png" />
    <script>
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.host + '/' +
        '?p=' + encodeURIComponent(l.pathname + l.search) +
        (l.hash || '')
      );
    </script>
  </head>
  <body></body>
</html>
