<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px; height: 630px; overflow: hidden;
      background: #0D1117;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      color: white; display: flex; flex-direction: column; justify-content: center;
      padding: 64px 88px; position: relative;
    }
    .glow-1 { position: absolute; top: -180px; right: -80px; width: 640px; height: 640px;
      background: radial-gradient(circle, rgba(16,185,129,0.18) 0%, transparent 65%); pointer-events: none; }
    .glow-2 { position: absolute; bottom: -200px; left: -100px; width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(16,185,129,0.07) 0%, transparent 65%); pointer-events: none; }
    .grid-bg { position: absolute; inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px); background-size: 40px 40px; }
    .content { position: relative; z-index: 1; max-width: 660px; }
    .badge { display: inline-flex; align-items: center; gap: 9px; padding: 7px 18px;
      background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.35); border-radius: 9999px;
      font-size: 13px; font-weight: 700; color: #10B981; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 30px; }
    .badge-icon { font-size: 15px; }
    h1 { font-size: 76px; font-weight: 900; line-height: 1.0; letter-spacing: -0.04em; color: white; margin-bottom: 22px; }
    h1 em { font-style: normal; color: #10B981; }
    .tagline { font-size: 22px; color: rgba(255,255,255,0.52); font-weight: 400; line-height: 1.5; max-width: 560px; margin-bottom: 40px; }
    .pills { display: flex; gap: 10px; flex-wrap: wrap; max-width: 600px; }
    .pill { padding: 8px 18px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 9999px; font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.65); white-space: nowrap; }
    .pill-accent { background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.3); color: #10B981; }
    .url { position: absolute; bottom: 44px; left: 88px; font-size: 15px; color: rgba(255,255,255,0.28); font-weight: 500; letter-spacing: 0.02em; z-index: 1; }

    /* Fly Now verdict card, right side */
    .score-card {
      position: absolute; right: 80px; top: 50%; transform: translateY(-50%);
      width: 300px; background: rgba(255,255,255,0.04); border: 1px solid rgba(16,185,129,0.4);
      border-top: 5px solid #10B981; border-radius: 22px; padding: 30px 28px; z-index: 1;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .sc-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.4); }
    .sc-verdict { font-size: 30px; font-weight: 900; color: #10B981; margin: 10px 0 18px; line-height: 1.05; }
    .sc-row { display: flex; gap: 26px; }
    .sc-stat-val { font-size: 30px; font-weight: 900; color: white; line-height: 1; }
    .sc-stat-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: rgba(255,255,255,0.4); margin-top: 5px; }
    .sc-check { position: absolute; top: 26px; right: 26px; width: 40px; height: 40px; border-radius: 50%;
      background: #10B981; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #0D1117; font-weight: 900; }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="content">
    <div class="badge"><span class="badge-icon">✈</span> PreFlight 107</div>
    <h1>Can I Fly a Drone <em>Today?</em></h1>
    <p class="tagline">Live wind, gusts &amp; the airspace for your city — free, no download.</p>
    <div class="pills">
      <span class="pill pill-accent">Live Conditions</span>
      <span class="pill">Airspace + LAANC</span>
      <span class="pill">TFR Alerts</span>
    </div>
  </div>

  <div class="score-card">
    <div class="sc-check">✓</div>
    <div class="sc-eyebrow">Live · Austin, TX</div>
    <div class="sc-verdict">Good to Fly</div>
    <div class="sc-row">
      <div><div class="sc-stat-val">5<span style="font-size:16px;color:rgba(255,255,255,0.5)"> mph</span></div><div class="sc-stat-label">Wind</div></div>
      <div><div class="sc-stat-val">6<span style="font-size:16px;color:rgba(255,255,255,0.5)"> mph</span></div><div class="sc-stat-label">Gusts</div></div>
    </div>
  </div>

  <span class="url">preflight107.com/flyable</span>
</body>
</html>
